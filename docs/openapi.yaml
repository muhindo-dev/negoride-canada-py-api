      summary: appeal
      operationId: account.appeal_post
      description: 'Auth: User JWT.'
      responses:
        '200':
          description: Envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        4XX:
          description: Error envelope (code 0, data.error_code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
