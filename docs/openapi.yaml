openapi: 3.0.3
info:
  title: NegoRide Canada API
  version: 4.0.0
  description: 'Generated from the Flask route table by scripts/gen_openapi.py. Every response uses the envelope {code: 1|0,
    message, data}. Money is integer cents (CAD) in v4 endpoints; timestamps are ISO-8601 UTC. Detailed payloads: docs/API.md,
    docs/SAFETY.md, docs/PAYMENTS_AND_REFUNDS.md, docs/DRIVER_ONBOARDING.md, docs/TRIP_STATE_MACHINE.md, docs/NOTIFICATIONS.md.'
servers:
- url: https://negoride.ugnews24.info
- url: http://localhost:5001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          enum:
          - 0
          - 1
        message:
          type: string
        data:
          description: Payload; on errors may contain error_code
