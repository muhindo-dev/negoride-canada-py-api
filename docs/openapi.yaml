        \ CONFIRMED →\n                            EN_ROUTE → ARRIVED → IN_PROGRESS, payment required)\n\nAll stage/status\
        \ changes go through the trip state machine, so v3 and v4\napps produce the same trip_events.\n\nAuth: User JWT."
